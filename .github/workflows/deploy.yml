name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  SERVICE_NAME: project-suya # The name of your Cloud Run service
  REGION: us-east4           # The region of your Cloud Run service

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Google auth

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Log into Google Cloud using a Service Account JSON key stored in GitHub Secrets
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      # Automatically build and deploy the Next.js app to Cloud Run from source
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          source: ./

      - name: Show Output
        run: echo "Deployment accessible at ${{ steps.deploy.outputs.url }}"
